<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectacular</title>
<meta name="robots" content="noindex">

<!--
  GitHub Pages serves this for every path it cannot find, which on this site is
  every path — so this file is the redirect, and index.html only exists for the
  bare domain.

  The redirect runs three ways, strongest first, because each covers a case the
  others miss:
    1. The script, which runs immediately and carries the path across.
    2. The meta refresh, for a visitor with JavaScript disabled. Zero delay, so
       search engines treat it close to a permanent redirect — but it cannot see
       the path, so it lands on the homepage.
    3. The visible link, for anything that honours neither.

  location.replace rather than assignment: it does not leave an entry in session
  history, so Back returns where the visitor actually came from instead of
  bouncing them through the redirect again.
-->
<script>
  (function () {
    var target = 'https://spectacular.systems' +
      window.location.pathname + window.location.search + window.location.hash;
    window.location.replace(target);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://spectacular.systems/">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    color: #17181c;
    background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #f6f6f7; background: #17181c; }
  }
  main { max-width: 32rem; padding: 2rem; text-align: center; }
  a { color: inherit; }
</style>
</head>
<body>
  <main>
    <p><strong>Specs 2 is now Spectacular</strong>, and this site has moved to
    <a href="https://spectacular.systems/">spectacular.systems</a>.</p>
    <p>If you are not redirected automatically, follow the link above.</p>
  </main>
</body>
</html>
